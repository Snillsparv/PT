<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1018">
  <meta name="description" content="Träningsdagbok med program, gångprogram och feedback – byggd för en kropp som behöver snälla doser.">
  <title>Min PT – Superpappa i träning</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/emblem.png">

  <!-- Installerbar app (hemskärm + offline) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Min PT">
</head>
<body>
  <header class="sidhuvud">
    <h1><img src="img/emblem.png" alt="" class="h1-emblem">Min PT <span class="lage-badge"><span aria-hidden="true">⚡</span> SUPERPAPPA-LÄGE</span></h1>
    <p>Träning på kroppens villkor – starta lägre, stegra långsammare.</p>
  </header>

  <nav class="flikar" aria-label="Huvudmeny"></nav>

  <main>
    <section class="vy" id="vy-idag" aria-label="Idag"></section>
    <section class="vy" id="vy-logga" aria-label="Logga träning"></section>
    <section class="vy" id="vy-program" aria-label="Program"></section>
    <section class="vy" id="vy-ovningar" aria-label="Övningar"></section>
    <section class="vy" id="vy-historik" aria-label="Historik"></section>
    <section class="vy" id="vy-superpappa" aria-label="Superpappa"></section>
    <section class="vy" id="vy-profil" aria-label="Profil"></section>
  </main>

  <input type="file" id="importFil" accept=".json,application/json" class="gomd"
         onchange="if (this.files[0]) importeraData(this.files[0], function (d) { DATA = d; sparaData(DATA); bytFlik('historik'); alert('Importen lyckades!'); }); this.value = '';">

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* Service worker: gör appen installerbar och användbar offline.
       Kräver https (eller localhost) – misslyckas den fungerar sidan
       precis som förut, bara utan offlineläge. */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("Service worker kunde inte registreras:", e);
        });
      });
    }
  </script>
</body>
</html>
